name: 01-Step-Output-Demo
on:
    workflow_dispatch:
jobs:
    step-output-demo-job:
        runs-on: ubuntu-latest
        steps:
            - name: Step Output Demo
              id: step-output-demo
              run: |
                echo "This is a demo of step outputs."
                echo "Setting output value..."
                echo "demo_output=Hello from Step Output Demo!" >> $GITHUB_OUTPUT

            - name: Display Step Output
              run: |
                echo "The output from the previous step is:"
                echo "${{ steps.step-output-demo.outputs.demo_output }}"