name: 3-Calling-Workflow-Output-Demo
on: 
    workflow_dispatch:
jobs:
    deploy-job:
        uses: ./.github/workflows/3-reusable-workflow-output.yaml
    notification-job:
        runs-on: ubuntu-latest
        needs: deploy-job
        steps:
            - name: Display Reusable Workflow Output
              run: |
                echo "Application endpoint url is ${{ needs.deploy-job.outputs.endpoint_url }}"