name: 01-Artifacts-Demo
on:
    workflow_dispatch:
jobs:
    flask-ci-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                context: .
                file: Dockerfile
                push: false
                tags: flask-app:latest
            - name: Run Container
              run: |
                docker run -d --name flask-app -p 5000:5000 flask-app:latest
            - name: Generate smoke test report
              run: | 
                echo "Running smoke tests..."
                sleep 5
                echo "Smoke test report generated."
                curl localhost:5000 > smoke-test-report.txt
                curl localhost:5000/health >> smoke-test-report.txt
            - name: Collect Container Logs
              run: |
                echo "Collecting container logs..."
                docker logs flask-app > container-logs.txt
            - name: Upload Smoke Test Report
              uses: actions/upload-artifact@v7
              with:
                name: Flast-CI-Artifacts
                path: |
                    smoke-test-report.txt
                    container-logs.txt
    review-job:
        runs-on: ubuntu-latest
        needs: flask-ci-job
        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v8
              with:
                name: Flast-CI-Artifacts
            - name: Display Artifacts
              run: |
                echo "Displaying downloaded artifacts..."
                echo "<=============Smoke Test Report:=================>"
                cat smoke-test-report.txt
                echo "-----------------------------"
                echo "<=============Container Logs:=================>"
                cat container-logs.txt